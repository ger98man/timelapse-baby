<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка синхронизации</title>
<style>
  body { background:#12100E; color:#F5EFE7; font:15px/1.5 -apple-system, system-ui, sans-serif;
         max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:20px; letter-spacing:-.01em; }
  p.lead { color:#9A918A; }
  .case { border:1px solid #332E2A; border-radius:12px; padding:14px 16px; margin:12px 0;
          background:#1C1917; }
  .case h2 { font-size:15px; margin:0 0 8px; }
  .ok::before  { content:'✓ '; color:#7FBF7F; }
  .bad::before { content:'✗ '; color:#E06A55; }
  .row { font-size:13px; color:#C9C0B8; margin:3px 0; font-family:ui-monospace, Menlo, monospace; }
  .bad { color:#E06A55; }
  #summary { font-size:17px; font-weight:650; padding:14px 16px; border-radius:12px; margin-top:20px; }
  .pass { background:#1F2E1F; color:#B7E3B7; }
  .fail { background:#2E1C19; color:#F0A99B; }
</style>
</head>
<body>
<h1>Проверка синхронизации</h1>
<p class="lead">Настоящий Google здесь не участвует: вместо Диска — заглушка в памяти.
Проверяется то, где живут ошибки, — порядок отправки, обратная загрузка на второй
телефон и разрешение конфликта, когда за один день снимали оба родителя.</p>
<div id="out"></div>
<div id="summary"></div>

<script type="module">
import { entries, settings } from '../src/db.js';
import { sync } from '../src/sync.js';

const out = document.getElementById('out');
let failures = 0;
let box;

function caseOf(title) {
  box = document.createElement('div');
  box.className = 'case';
  box.innerHTML = `<h2>${title}</h2>`;
  out.appendChild(box);
}
function check(label, condition, detail = '') {
  const row = document.createElement('div');
  row.className = 'row ' + (condition ? 'ok' : 'bad');
  row.textContent = label + (detail ? ` — ${detail}` : '');
  box.appendChild(row);
  if (!condition) failures++;
}

// --- поддельный Диск --------------------------------------------------------
function fakeDrive() {
  const files = new Map();
  let seq = 0;
  let clock = Date.now() - 3600000;   // как у настоящего Диска — чуть в прошлом
  const tick = () => new Date(clock += 60000).toISOString();

  return {
    files,
    async ensureRoot(name, known) { return known || 'root'; },
    async adoptRoot(id) { return id; },
    async folderForDay() { return 'folder'; },
    async putDayFile({ dateKey, name, blob, kind, fileId }) {
      const id = fileId || 'f' + (++seq);
      const modifiedTime = tick();
      const appProperties = { everyday: '1', kind };
      if (dateKey) appProperties.day = dateKey;
      files.set(id, { id, name, blob, modifiedTime, appProperties });
      return { id, modifiedTime };
    },
    async listDayFiles() {
      return [...files.values()].map(f => ({ ...f, appProperties: { ...f.appProperties } }));
    },
    async updateProps(id, props) {
      const f = files.get(id);
      f.appProperties = { ...f.appProperties, ...props };
      f.modifiedTime = tick();
      return { id, modifiedTime: f.modifiedTime };
    },
    async download(id) { return files.get(id).blob; },
    async trash(id) { files.delete(id); },
    async folderLink() { return 'https://drive.google.com/x'; },
    count(kind) {
      return [...files.values()].filter(f => f.appProperties.kind === kind).length;
    },
  };
}

// --- вспомогательное --------------------------------------------------------
async function jpeg(tint) {
  const c = document.createElement('canvas');
  c.width = c.height = 240;
  const ctx = c.getContext('2d');
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, 240, 240);
  ctx.fillStyle = '#000';
  ctx.fillRect(60, 90, 20, 20);
  ctx.fillRect(160, 90, 20, 20);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}

async function wipeLocal() {
  for (const d of await entries.allDates()) await entries.delete(d);
}

async function seedDay(date, tint, comment) {
  const photo = await jpeg(tint);
  await entries.put({
    date, photo, w: 240, h: 240, thumb: photo, aligned: photo,
    comment, eyes: null, createdAt: Date.now(),
  });
}

// --- прогон -----------------------------------------------------------------
(async () => {
  await settings.merge({ driveFolderId: null, videoSize: 240 });
  await wipeLocal();
  const drive = fakeDrive();

  // 1. первый телефон отдаёт свои дни
  caseOf('Телефон 1 отправляет три дня');
  await seedDay('2026-09-10', '#c96', 'первый');
  await seedDay('2026-09-11', '#9c6', 'второй');
  await seedDay('2026-09-12', '#69c', '');
  let r = await sync(drive);
  check('отправлено три снимка', r.pushed === 3, `pushed=${r.pushed}`);
  check('ничего не тянули обратно', r.pulled === 0, `pulled=${r.pulled}`);
  check('на Диске три фото', drive.count('photo') === 3);
  check('комментариев два, пустой не поехал', drive.count('note') === 2,
    `note=${drive.count('note')}`);
  check('имена файлов по датам',
    [...drive.files.values()].some(f => f.name === '2026-09-11.jpg'));

  // 2. повторная синхронизация не должна ничего делать
  caseOf('Повторная синхронизация вхолостую');
  r = await sync(drive);
  check('ничего не отправлено', r.pushed === 0, `pushed=${r.pushed}`);
  check('ничего не получено', r.pulled === 0, `pulled=${r.pulled}`);
  check('файлов на Диске не прибавилось', drive.files.size === 6, `files=${drive.files.size}`);

  // 2b. настройки живут в папке, а не на телефоне
  caseOf('Настройки уезжают в config.json и возвращаются');
  await settings.merge({ babyName: 'Ева', birthDate: '2026-09-01' });
  await sync(drive);
  const cfgFile = [...drive.files.values()].find(f => f.name === 'config.json');
  check('config.json появился в папке', Boolean(cfgFile));
  const parsed = cfgFile ? JSON.parse(await cfgFile.blob.text()) : {};
  check('имя записано', parsed.babyName === 'Ева', JSON.stringify(parsed.babyName));
  check('дата записана', parsed.birthDate === '2026-09-01');
  check('файл читается человеком', typeof parsed._комментарий === 'string');

  // другой телефон: настроек нет, но на Диске они есть
  await settings.merge({ babyName: '', birthDate: null });
  await settings.touchProfile(0);
  await sync(drive);
  const back = await settings.all();
  check('имя вернулось с Диска', back.babyName === 'Ева', JSON.stringify(back.babyName));
  check('дата вернулась с Диска', back.birthDate === '2026-09-01', JSON.stringify(back.birthDate));
  check('лишнего config.json не наплодили',
    [...drive.files.values()].filter(f => f.name === 'config.json').length === 1);

  // 2c. разметка глаз принадлежит снимку и обязана его сопровождать
  caseOf('Разметка глаз уезжает в метаданные и возвращается');
  const marked = '2026-09-12';
  const mine0 = await entries.get(marked);
  mine0.eyes = { lx: 0.41, ly: 0.38, rx: 0.59, ry: 0.40 };
  await entries.put(mine0);
  const bytesBefore = [...drive.files.values()]
    .find(f => f.appProperties.day === marked && f.appProperties.kind === 'photo').blob.size;
  await sync(drive);
  const shot = [...drive.files.values()]
    .find(f => f.appProperties.day === marked && f.appProperties.kind === 'photo');
  check('координаты легли в метаданные файла', Boolean(shot.appProperties.eyes),
    String(shot.appProperties.eyes));
  check('снимок при этом не перезаливали', shot.blob.size === bytesBefore);

  // чистая установка: снимок вернулся — значит и разметка вернулась
  await wipeLocal();
  await sync(drive);
  const restoredEyes = (await entries.get(marked)).eyes;
  check('разметка вернулась с Диска', Boolean(restoredEyes),
    JSON.stringify(restoredEyes));
  check('координаты те же', restoredEyes &&
    Math.abs(restoredEyes.lx - 0.41) < 1e-4 && Math.abs(restoredEyes.ry - 0.40) < 1e-4);
  check('кадр пересобран по этой разметке', Boolean((await entries.get(marked)).aligned));

  // 3. второй телефон, пустой, забирает всё
  caseOf('Телефон 2 (чистая установка) забирает альбом');
  await wipeLocal();
  r = await sync(drive);
  const restored = await entries.range('0000-01-01', '9999-12-31');
  check('вернулись три дня', restored.length === 3, `дней=${restored.length}`);
  check('фотографии на месте', restored.every(e => e.photo && e.photo.size > 0));
  check('выровненные кадры пересозданы', restored.every(e => e.aligned));
  check('комментарий доехал',
    restored.find(e => e.date === '2026-09-10').comment === 'первый',
    JSON.stringify(restored.find(e => e.date === '2026-09-10').comment));
  check('обратно ничего не залили', r.pushed === 0, `pushed=${r.pushed}`);

  // 4. новый день со второго телефона
  caseOf('Телефон 2 добавляет свой день');
  await seedDay('2026-09-13', '#c69', 'со второго телефона');
  r = await sync(drive);
  check('отправлен один снимок', r.pushed === 1, `pushed=${r.pushed}`);
  check('на Диске четыре фото', drive.count('photo') === 4, `photo=${drive.count('photo')}`);

  // 5. конфликт: оба сняли один и тот же день
  caseOf('Оба сняли один день — ни один снимок не потерян');
  const day = '2026-09-11';
  // на Диске появляется более свежая версия (как будто её залил другой телефон)
  const remoteFile = [...drive.files.values()].find(
    f => f.appProperties.day === day && f.appProperties.kind === 'photo');
  await drive.putDayFile({ rootId: 'root', dateKey: day, name: `${day}.jpg`,
    blob: await jpeg('#fff'), kind: 'photo', fileId: remoteFile.id });
  // и одновременно этот день переснят локально
  const mine = await entries.get(day);
  mine.photo = await jpeg('#111');
  mine.updatedAt = Date.now() + 1000;
  await entries.put(mine);

  const before = drive.count('extra');
  r = await sync(drive);
  check('конфликт замечен', r.conflicts === 1, `conflicts=${r.conflicts}`);
  check('проигравший снимок уехал на Диск отдельным файлом',
    drive.count('extra') === before + 1, `extra=${drive.count('extra')}`);
  check('файл назван по-человечески',
    [...drive.files.values()].some(f => f.name === `${day}-2.jpg`));
  const after = await entries.get(day);
  check('локально показывается версия с Диска', after.photo.size > 0);
  check('счётчик дней не изменился',
    (await entries.allDates()).length === 4, `дней=${(await entries.allDates()).length}`);

  // 6. и всё это переживает ещё один заход
  caseOf('После конфликта всё успокаивается');
  r = await sync(drive);
  check('лишних отправок нет', r.pushed === 0, `pushed=${r.pushed}`);
  check('лишних загрузок нет', r.pulled === 0, `pulled=${r.pulled}`);

  await wipeLocal();
  await settings.merge({ babyName: '', birthDate: null });
  await settings.set('driveFolderId', null);
  await settings.touchProfile(0);

  const s = document.getElementById('summary');
  s.className = failures ? 'fail' : 'pass';
  s.textContent = failures ? `Провалено проверок: ${failures}` : 'Все проверки прошли';
})().catch(e => {
  const s = document.getElementById('summary');
  s.className = 'fail';
  s.textContent = 'Тест упал: ' + e.message;
  console.error(e);
});
</script>
</body>
</html>
