# Статический сайт на Render. Сборки нет: файлы отдаются как есть.
#
# Единственная важная настройка — заголовки кэширования. index.html, sw.js и
# config.js должны отдаваться с no-cache, иначе браузер неделями держит старую
# версию и обновления до людей не доезжают. Остальное (src/*.js, styles.css)
# Service Worker сам тянет по сети, а кэш держит только на случай офлайна.

services:
  - type: web
    runtime: static
    name: timelapse-baby
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    buildCommand: ''
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
